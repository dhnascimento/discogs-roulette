version: '3.8'

services:
  discogs-roulette:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discogs-roulette
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Discogs__UserAgent=DiscogsRoulette/1.0
      # Uncomment and set if you have a personal access token
      # - Discogs__PersonalAccessToken=your_token_here
    restart: unless-stopped
